name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject Environment Variables (from GitHub Secrets)
        run: |
          echo "VITE_GAS_URL=${{ secrets.VITE_GAS_URL }}" > .env.production
          echo "VITE_GAS_URL=${{ secrets.VITE_GAS_URL }}" > .env.local

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan keystore dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "Membuat release keystore otomatis untuk penandatanganan APK..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias pekarangan \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass pekarangan123 \
              -keypass pekarangan123 \
              -dname "CN=Pekarangan, OU=Produksi, O=CredibleMark, L=Jakarta, ST=DKI, C=ID"
          fi

      - name: Build Signed Android Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'pekarangan123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pekarangan' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'pekarangan123' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Signed Release APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Pekarangan-Release-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Prepare APK for GitHub Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Pekarangan-App.apk

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Pekarangan App v1.0.0 (Signed Release)' }}
          body: |
            ### 📱 Pekarangan Pangan Bergizi - Signed Android APK
            
            Aplikasi Android siap pakai yang sudah ditandatangani secara resmi (Signed Release APK).
            
            - **Versi**: 1.0.0
            - **Arsitektur**: Local-First Offline Mode (Blank Spot Ready)
            - **Integrasi**: Google Sheets Backend + Multi-Device Synchronization
            
            #### 📥 Cara Install di HP Android:
            1. Unduh file **`Pekarangan-App.apk`** di bagian *Assets* di bawah ini.
            2. Buka file APK di HP Android Anda.
            3. Jika muncul konfirmasi *"Install unknown apps"*, izinkan untuk melanjutkan instalasi.
          files: Pekarangan-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
