name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject Environment Variables (from GitHub Secrets)
        run: |
          echo "VITE_GAS_URL=${{ secrets.VITE_GAS_URL }}" > .env.production
          echo "VITE_GAS_URL=${{ secrets.VITE_GAS_URL }}" > .env.local

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan keystore dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "Membuat release keystore otomatis untuk penandatanganan APK..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias pekarangan \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass pekarangan123 \
              -keypass pekarangan123 \
              -dname "CN=Pekarangan, OU=Produksi, O=CredibleMark, L=Jakarta, ST=DKI, C=ID"
          fi

      - name: Build Signed Android Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'pekarangan123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pekarangan' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'pekarangan123' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pekarangan-Release-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
