name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject Environment Variables (from GitHub Secrets)
        run: |
          echo "VITE_GAS_URL=${{ secrets.VITE_GAS_URL }}" > .env.production
          echo "VITE_GAS_URL=${{ secrets.VITE_GAS_URL }}" > .env.local

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Menggunakan keystore dari GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          else
            echo "Membuat release keystore otomatis untuk penandatanganan APK..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias pekarangan \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass pekarangan123 \
              -keypass pekarangan123 \
              -dname "CN=Pekarangan, OU=Produksi, O=CredibleMark, L=Jakarta, ST=DKI, C=ID"
          fi

      - name: Build Signed Android Release APK
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'pekarangan123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'pekarangan' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'pekarangan123' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Signed Release APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Pekarangan-Release-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Prepare APK and Generate Changelog from Commits
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Pekarangan-App.apk

          APP_VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            RELEASE_TAG="v${APP_VERSION}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

          echo "### 📱 Pekarangan App ${RELEASE_TAG} - Signed Android APK" > release_notes.md
          echo "" >> release_notes.md
          echo "Aplikasi Android siap pakai yang sudah ditandatangani secara resmi (*Signed Release APK*)." >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Versi**: ${APP_VERSION}" >> release_notes.md
          echo "- **Arsitektur**: Local-First Offline Mode (Blank Spot Ready)" >> release_notes.md
          echo "- **Integrasi**: Google Sheets Backend + Single Device Policy (1 Akun 1 HP)" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📝 Catatan Rilis & Riwayat Komit:" >> release_notes.md
          echo "" >> release_notes.md
          
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Mengambil commit dari $PREV_TAG sampai HEAD"
            git log ${PREV_TAG}..HEAD --pretty=format:"* **%s** (%h - %an)" >> release_notes.md
          else
            git log -n 25 --pretty=format:"* **%s** (%h - %an)" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "#### 📥 Cara Install di HP Android:" >> release_notes.md
          echo "1. Unduh file **\`Pekarangan-App.apk\`** di bagian **Assets** di bawah." >> release_notes.md
          echo "2. Buka file APK di HP Android Anda." >> release_notes.md
          echo "3. Jika muncul konfirmasi *\"Install unknown apps\"*, izinkan untuk melanjutkan instalasi." >> release_notes.md

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Pekarangan App ${{ env.RELEASE_TAG }} (Signed Release)
          body_path: release_notes.md
          files: Pekarangan-App.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
